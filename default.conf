server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
        # Always revalidate the app shell so browsers pick up new versions
        # immediately instead of serving a stale cached index.html.
        add_header Cache-Control "no-cache";
    }

    # Same-origin reverse proxy to the Traefik API so the dashboard can
    # auto-discover routers from the browser without tripping CORS.
    #
    # Safe because: the API is read-only, this proxy is only reachable behind
    # the dashboard's own local-only@file router (LAN/VPN only), and port 8080
    # is never published. We talk to Traefik over the normal websecure
    # entrypoint and set the Host header so the api@internal router matches.
    location /traefik-api/ {
        proxy_pass https://traefik:443/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name traefik.example.com;
        proxy_ssl_verify off;
        # Drop any basic-auth challenge so probing/api calls never pop the
        # browser's native sign-in dialog (e.g. Sonarr uses Basic auth). The
        # fetch still sees the 401 status; we just don't surface the challenge.
        proxy_hide_header WWW-Authenticate;
        proxy_set_header Host traefik.example.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Power toggles → the dashboard-power backend (start/stop, allowlist only).
    # Same-origin, so no CORS. Reachable only behind the dashboard's own
    # local-only@file router; the backend has no Traefik route of its own and
    # enforces its own allowlist, so this proxy can't be used to touch arbitrary
    # containers even if reached.
    location /power/ {
        proxy_pass http://dashboard-power:8080/power/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;   # docker stop can take up to the stop-timeout
        add_header Cache-Control "no-store" always;
    }

    # Read-only per-container docker state + healthcheck verdict for the status
    # dots. Same backend, no control, not allowlist-gated (status only).
    location /status/ {
        proxy_pass http://dashboard-power:8080/status/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }

    # Same-origin liveness probe. The browser can't reliably check other origins
    # itself — Chrome's ORB rejects cross-origin no-cors HTML responses, so a
    # client-side fetch reads "down" for sites that are actually up. Instead we
    # bounce the check through Traefik here (same path as the API proxy) and let
    # the page read the real HTTP status. Restricted to *.example.com so this
    # is not an open proxy. Traefik returns 502/504 when the backend is down.
    location ~ "^/probe/(?<ptarget>[a-z0-9.-]+\.example\.com)$" {
        rewrite ^ / break;
        proxy_pass https://traefik:443;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $ptarget;
        proxy_ssl_verify off;
        # Drop any basic-auth challenge so probing/api calls never pop the
        # browser's native sign-in dialog (e.g. Sonarr uses Basic auth). The
        # fetch still sees the 401 status; we just don't surface the challenge.
        proxy_hide_header WWW-Authenticate;
        proxy_set_header Host $ptarget;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 6s;
        proxy_intercept_errors off;
        add_header Cache-Control "no-store" always;
    }

    # Guard for /probe/ targets the regex above does NOT match (off-domain,
    # uppercase, malformed, empty). Without this they fall through to
    # `location /`, which serves index.html with HTTP 200 — and the page treats
    # any non-5xx as "reachable", so an unprobeable host showed a permanent
    # green "Healthy" dot for a service nobody ever checked. Failing silently
    # green is the worst direction for a status light, so answer 421 instead:
    # "misdirected request" is exactly the condition, and nothing behind Traefik
    # emits it, so the dashboard can tell it apart from a real service reply.
    location /probe/ {
        return 421;
        add_header Cache-Control "no-store" always;
    }
}
